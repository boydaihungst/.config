# Prevent screen from sleeping when using certain apps
windowrule {
  name = windowrule-52
  idle_inhibit = fullscreen
  match:class = ^(.*)$
}

windowrule {
  name = windowrule-53
  idle_inhibit = fullscreen
  match:title = ^(.*)$
}

windowrule {
  name = windowrule-54
  idle_inhibit = fullscreen
  match:fullscreen_state_internal = 2
  match:fullscreen_state_client = 2
}

