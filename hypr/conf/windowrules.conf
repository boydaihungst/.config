# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# single app don't show border
# workspace = w[tv1], gapsout:0, gapsin:0
windowrule {
  name = windowrule-1
  border_color = rgba(595959aa)
  border_size = 0
  match:float = 0
  match:workspace = w[tv1]
}

windowrule {
  name = windowrule-2
  border_color = rgba(595959aa)
  match:float = 0
  match:workspace = f[1]
}

# Bug xwindow
# windowrule = maxsize 1500 1000, floating:1
# windowrule = minsize 100 100, floating:1
windowrule {
  name = windowrule-3
  persistent_size = on
  match:float = 1
}


# fix ibus
windowrule {
  name = windowrule-4
  no_focus = on
  match:class = ^(Ibus-ui-gtk2)$
}

windowrule {
  name = windowrule-5
  no_focus = on
  match:class = ^(Ibus-ui-gtk3)$
}

windowrule {
  name = windowrule-6
  no_focus = on
  match:class = ^(Ibus-ui-gtk5)$
}

windowrule {
  name = windowrule-7
  no_focus = on
  match:class = ^(Ibus-ui-gtk4)$
}


# Assign workspaces to specific monitors
workspace = 1, monitor:eDP-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1

# Assign applications to workspaces
windowrule {
  name = windowrule-8
  workspace = 1
  match:class = ^(btop|htop|kitty|lvim|vim|nvim|org.wezfurlong.wezterm|com.mitchellh.ghostty)$
}

windowrule {
  name = windowrule-9
  workspace = 2
  match:class = ^(?i)(waterfox-default|waterfox|firefox|firefox-default)$
}

windowrule {
  name = windowrule-10
  workspace = 3
  match:class = ^(thunar|ranger|lfcd|lf|vifm|yazi)$
}

windowrule {
  name = windowrule-11
  workspace = 4
  match:class = ^thunderbird$
}

windowrule {
  name = windowrule-12
  workspace = 5
  match:class = ^(telegramDesktop|skype|pidgin|discord|blender)$
}

windowrule {
  name = windowrule-13
  workspace = 6
  match:class = ^(calibre-ebook-viewer|calibre)$
}

windowrule {
  name = windowrule-14
  workspace = 7
  match:class = ^(bottles|steam|lutris)$
}


# Floating windows
windowrule {
  name = windowrule-15
  tile = on
  match:class = ^yazi$
}

windowrule {
  name = windowrule-16
  float = on
  size = (monitor_w*0.8) (monitor_h*0.9)
