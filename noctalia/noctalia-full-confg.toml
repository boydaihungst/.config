[widget.active_window]
icon_size = 20
max_length = 800
title_scroll = "on_hover"

[widget.audio_visualizer]
bands = 8
color_2 = "error"

[widget.bluetooth]
show_label = true

[widget.clock]
format = "{:%H:%M:%S}"

[widget.control-center]
enabled = false

[widget.cpu]
visualization = "none"

[widget.current]
type = "thaer99ob/default-apps:current"

[widget.date]
format = " {:%a %d %b %Y}"

[widget.media]
hide_when_idle = true
hide_when_no_media = true
show_progress = true
title_scroll = "on_hover"

[widget.notifications]
hide_when_no_unread = true

[widget.ram]
visualization = "none"

[widget.rapoo_battery]
type = "boydaihungst/rapoo-battery:rapoo_battery"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.session]
enabled = false

[widget.status]
