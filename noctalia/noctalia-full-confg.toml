[notification]
background_opacity = 0.59999998658895493
follow_focused_output = true
history_retention_hours = 48
layer = "overlay"
max_visible = 3
offset_x = 40
offset_y = 40
position = "bottom_right"

[osd]
background_opacity = 0.79999998211860657
hide_delay_ms = 2000
offset_y = 0

[plugin_settings."aristides/udiskie"]
auto_open_filemanager = true

[plugin_settings."noctalia/screen_recorder"]
copy_to_clipboard = true
glyph_idle = "video-plus"
glyph_pending = "capture"
glyph_recording = "capture-filled"
glyph_unavailable = "camera-exclamation"
video_bitrate_mode = "vbr"
video_quality = "high"

[plugin_settings."strob3/dnf-updater"]
check_interval = 120
include_flatpak_runtimes = true
show_widget_when_clean = false

[plugin_settings."umedbazarov/crashes"]
poll_seconds = 60

[plugins]
auto_update = "all"
enabled = [
    "aristides/udiskie",
    "noctalia/screen_recorder",
    "strob3/dnf-updater",
    "thaer99ob/default-apps",
    "umedbazarov/crashes",
    "yangkx/usbeehive",
    "boydaihungst/rapoo-battery"
]

    [[plugins.source]]
    kind = "git"
    location = ""
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = ""
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "~/.config/noctalia/plugins"
    name = "my-plugins"

[shell]
avatar_path = "/home/huyhoang/.icons/avatar.jpg"
card_borders = false
clipboard_auto_paste = "off"
external_ip_enabled = true
font_family = "Hack Nerd Font"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_expand_all_groups = true
settings_window_translucent = true
umbriel_overview_close_on_launch_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    auto_paste = "off"
    categories = false
    category_icons_only = true
    fetch_exchange_rates = false
    layout = "simple"
    search_position = "top"
    show_session_button = false
    show_settings_button = false
    width = 1100

    [shell.panel]
    border_width = 2.0
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center_right"
    transparency_mode = "soft"

    [shell.screenshot]
    confirm_region = true
    directory = "/home/huyhoang/Pictures/Screenshots"
    filename_pattern = "%Y-%m-%d--%H-%M-%S"
    show_cursor = true

    [shell.session]
    grid = true
    grid_columns = 1
    show_shortcuts = false

    [shell.shadow]
    direction = "center"

[system.monitor]
cpu_temp_activity_threshold = 70

[theme]
builtin = "Nord"
community_palette = "GitHub Dark"
custom_palette = "MyTheme"
source = "custom"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "btop", "foot", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "sway", "umbriel", "wezterm" ]
    community_ids = [
        "chromium-based",
        "discord",
        "telegram",
        "gimp",
        "inkscape",
        "libreoffice",
        "obsidian",
        "vscode",
        "steam",
        "fuzzel",
        "rofi",
        "fastfetch",
        "speedcrunch",
        "fcitx5",
        "papirus-icons",
        "thunar",
        "bat",
        "fzf",
        "glow",
        "lazygit"
    ]

[wallpaper]
transition = [ "diamond", "disc", "golden", "vortex" ]
transition_on_startup = true

    [wallpaper.automation]
    pause_on_fullscreen = true

    [wallpaper.default]
    path = "/home/huyhoang/Pictures/wallpaper.png"

    [wallpaper.last]
    path = "/home/huyhoang/Pictures/wallpaper.png"

    [wallpaper.monitors.DP-1]
    path = "/home/huyhoang/Pictures/wallpaper.png"

    [wallpaper.monitors.DP-2]
    path = "/home/huyhoang/Pictures/wallpaper.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/huyhoang/Pictures/wallpaper.png"

