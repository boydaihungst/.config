[accessibility]
high_contrast = true

[audio]
enable_screenshot_sounds = false
sound_volume = 0.69999998435378075
spectrum_frame_rate = 120

[bar.default]
background_opacity = 0.79999998211860657
center = [ "active_window", "wallpaper" ]
color = "primary"
end = [
    "status",
    "widget",
    "brightness",
    "network",
    "bluetooth",
    "rapoo_battery",
    "volume",
    "input_volume",
    "battery",
    "tray",
    "group:g5"
]
font_family = "Hack Nerd Font"
font_weight = 700
margin_ends = 0
padding = 16
panel_overlap = 0
radius = 0
shadow = false
start = [ "group:g2", "group:g1", "group:g3", "media", "taskbar" ]
widget_spacing = 10

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "start"
    border_width = 1.0
    enabled = true
    fill = "on_primary"
    id = "g2"
    members = [ "clock", "date" ]
    opacity = 0.0
    padding = 0.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "on_primary"
    id = "g1"
    members = [ "temp", "cpu" ]
    opacity = 0.0
    padding = 0.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "on_primary"
    id = "g3"
    members = [ "ram", "sysmon" ]
    opacity = 0.0
    padding = 0.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "start"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g5"
    members = [ "notifications", "current", "usb", "recorder", "caffeine" ]
    opacity = 1.0
    padding = 0.0

[bluetooth]
connect_when_enabled = true
connection_notifications = true

[brightness]
enable_ddcutil = true

[calendar]
dedupe_events = true

[control_center]
show_avatar_border = false

    [control_center.calendar]
    show_events_card = false

    [control_center.media]
    show_visualizer = false

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "wallpaper"

    [[control_center.shortcuts]]
    type = "noctalia/screen_recorder:toggle"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "screen_time"

    [[control_center.shortcuts]]
    type = "nightlight"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.69999998435378075

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "screen_off"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "lock"
    enabled = true
    timeout = 315.0

[keybinds]
cancel = [ "escape" ]
copy = [ "ctrl+c" ]
delete = [ "del" ]
down = [ "ctrl+j", "tab", "down" ]
left = [ "left" ]
right = [ "right" ]
save = [ "ctrl+s" ]
tab_next = [ "ctrl+l" ]
tab_previous = [ "ctrl+h" ]
up = [ "ctrl+k", "shift+tab", "shift+iso_left_tab", "up" ]
validate = [ "return", "kp_enter" ]

[location]
