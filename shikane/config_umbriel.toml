# Special profile go first

# 2 DisplayPort monitor AOC Q27G42ZE, monitor AOC Q27G4ZDP + HDMI Samsung soundbar
[[profile]]
  exec = [
    "noctalia msg osd-show device-desktop \"$SHIKANE_PROFILE_NAME\"",
    "/usr/local/bin/switch-stereo.sh"
  ]
  name = "DP AOC Q27G42ZE + DP AOC Q27G4ZDP + Samsung soundbar"

  [[profile.output]]
    enable = false
    search = ["/eDP-[1-9]"]

  [[profile.output]]
    adaptive_sync = false
    enable        = true
    mode          = "best"
    position      = "2560,0"
    scale         = 1
    search        = ["n/DP-[1-9]", "v=AOC", "m=Q27G42ZE"]
    # exec          = [
    #   "umbriel msg workspace-move-to-output $SHIKANE_OUTPUT_NAME 2",
    #   "umbriel msg workspace-move-to-output $SHIKANE_OUTPUT_NAME 4",
    #   "umbriel msg workspace-move-to-output $SHIKANE_OUTPUT_NAME 5",
    #   "umbriel msg workspace-move-to-output $SHIKANE_OUTPUT_NAME 6",
    #   "umbriel msg workspace-move-to-output $SHIKANE_OUTPUT_NAME 7",
    #   "umbriel msg workspace-move-to-output $SHIKANE_OUTPUT_NAME 8",
    #   "umbriel msg workspace-move-to-output $SHIKANE_OUTPUT_NAME 9",
    # ]

  [[profile.output]]
    adaptive_sync = false
    enable        = true
    mode          = "best"
    position      = "0,0"
    scale         = 1
    search        = ["n/DP-[1-9]", "v=AOC", "m=Q27G4ZDP"]
    # exec          = [
    #   "umbriel msg workspace-move-to-output $SHIKANE_OUTPUT_NAME 1",
    #   "umbriel msg workspace-move-to-output $SHIKANE_OUTPUT_NAME 3",
    # ]

  [[profile.output]]
    adaptive_sync = false
    enable        = true
    mode          = "1920x1080@60.00Hz"
    position      = "0,1600"
    scale         = 1
    search        = [
      "n/HDMI-[ABC]-[1-9]",
      "v=Samsung Electric Company",
      "m=SAMSUNG"
    ]
    # exec          = ["/usr/local/bin/switch-stereo.sh"]

