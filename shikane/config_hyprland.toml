# Laptop monitor only
[[profile]]
  exec = [
    "notify-send -a monitor-mode -i disper \"$SHIKANE_PROFILE_NAME\"",
    "killall -SIGUSR2 waybar",
  ]
  name = "Default"

  [[profile.output]]
    adaptive_sync = true
    enable        = true
    exec          = [
      "hyprctl keyword monitor \"eDP-1, 2560x1440@240, auto, 1.25, bitdepth, 8, vrr, 1, cm, auto, icc, /home/huyhoang/.config/sway/scripts/color_profiles/Q27G42ZE.icm\""
    ]
    mode          = "best"
    position      = "0,0"
    scale         = 1.33
    search        = ["/eDP-[1-9]"]

