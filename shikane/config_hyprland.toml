# Special profile go first

# 2 DisplayPort monitor AOC Q27G42ZE, monitor AOC Q27G4ZDP + HDMI Samsung soundbar
[[profile]]
  exec = [
    "notify-send -a monitor-mode -i disper \"$SHIKANE_PROFILE_NAME\"",
    "killall -SIGUSR2 waybar",
    "nohup ~/.config/shikane/DP_mode_1.sh > /dev/null 2>&1 &",
  ]
  name = "DP AOC Q27G42ZE + DP AOC Q27G4ZDP + Samsung soundbar"

  [[profile.output]]
    enable = false
    search = ["/eDP-[1-9]"]

  [[profile.output]]
    adaptive_sync = true
    enable        = true
    mode          = "!2560x1440@240.00Hz"
    position      = "2560,0"
    scale         = 1
    search        = ["n/DP-[1-9]", "v=AOC", "m=Q27G42ZE"]

  [[profile.output]]
    adaptive_sync = true
    enable        = true
    mode          = "!2560x1440@280.00Hz"
    position      = "0,0"
    scale         = 1
    search        = ["n/DP-[1-9]", "v=AOC", "m=Q27G4ZDP"]

  [[profile.output]]
    adaptive_sync = true
    enable        = true
    mode          = "1920x1080@60.00Hz"
    position      = "0,1600"
    scale         = 1
    search        = [
      "n/HDMI-[ABC]-[1-9]",
      "v=Samsung Electric Company",
      "m=SAMSUNG"
    ]

