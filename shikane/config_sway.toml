# Laptop monitor only
[[profile]]
  exec = [
    "notify-send -a monitor-mode -i disper \"$SHIKANE_PROFILE_NAME\"",
    "killall -SIGUSR2 waybar",
  ]
  name = "Default"

  [[profile.output]]
    adaptive_sync = false
    enable        = true
    exec          = [
      "output eDP-1 mode 2560x1600@240Hz scale 1.25 render_bit_depth 10 color_profile icc \"~/.config/sway/scripts/color_profiles/TPLCD_2039_Native.icm\" bg \"~/.config/sway/wallpaper\" fill"
    ]
    mode          = "best"
    position      = "0,0"
    scale         = 1.25
    search        = ["/eDP-[1-9]"]

