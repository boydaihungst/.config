# 2 DisplayPort monitor AOC Q27G42ZE, monitor AOC Q27G4ZDP + HDMI Samsung soundbar
[[profile]]
  exec = [
    "notify-send -a monitor-mode -i disper \"$SHIKANE_PROFILE_NAME\"",
    "killall -SIGUSR2 waybar",
  ]
  name = "DP AOC Q27G42ZE + DP AOC Q27G4ZDP + Samsung soundbar"

  [[profile.output]]
    enable = false
    search = ["/eDP-[1-9]"]

  [[profile.output]]
    adaptive_sync = false
    enable        = true
    mode          = "!2560x1440@240.00Hz"
    position      = "2560,0"
    scale         = 1
    search        = ["n/DP-[1-9]", "v=AOC", "m=Q27G42ZE"]
    exec          = [
      "swaymsg output $SHIKANE_OUTPUT_NAME hdr off render_bit_depth 8 color_profile icc \"~/.config/sway/scripts/color_profiles/Q27G42ZE.icm\" bg \"~/.config/sway/wallpaper\" fill",
      "swaymsg workspace 4, move workspace to $SHIKANE_OUTPUT_NAME",
      "swaymsg workspace 5, move workspace to $SHIKANE_OUTPUT_NAME",
      "swaymsg workspace 6, move workspace to $SHIKANE_OUTPUT_NAME",
      "swaymsg workspace 7, move workspace to $SHIKANE_OUTPUT_NAME",
      "swaymsg workspace 8, move workspace to $SHIKANE_OUTPUT_NAME",
      "swaymsg workspace 9, move workspace to $SHIKANE_OUTPUT_NAME",
    ]

  [[profile.output]]
    adaptive_sync = false
    enable        = true
    mode          = "!2560x1440@280.00Hz"
    position      = "0,0"
    scale         = 1
    search        = ["n/DP-[1-9]", "v=AOC", "m=Q27G4ZDP"]
    exec          = [
      "swaymsg output $SHIKANE_OUTPUT_NAME render_bit_depth 10 color_profile icc \"~/.config/sway/scripts/color_profiles/Q27G4ZDP.icm\" bg \"~/.config/sway/wallpaper\" fill",
      "swaymsg workspace 1, move workspace to $SHIKANE_OUTPUT_NAME",
      "swaymsg workspace 2, move workspace to $SHIKANE_OUTPUT_NAME",
      "swaymsg workspace 3, move workspace to $SHIKANE_OUTPUT_NAME",
    ]

  [[profile.output]]
    adaptive_sync = false
    enable        = true
    mode          = "1920x1080@60.00Hz"
    position      = "5120,1440"
    scale         = 1
    search        = [
      "n/HDMI-[ABC]-[1-9]",
      "v=Samsung Electric Company",
      "m=SAMSUNG"
    ]
    exec          = [
      "swaymsg output $SHIKANE_OUTPUT_NAME hdr off",
      "swaymsg workspace 10, move workspace to $SHIKANE_OUTPUT_NAME"
    ]

