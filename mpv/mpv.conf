
# ==========================================================================
# General Playback & Video Output
# ==========================================================================
save-position-on-quit=yes
save-watch-history=yes
write-filename-in-watch-later-config=yes
watch-later-options-remove=sub-pos
vo=gpu-next
# gpu-api=vulkan
# gpu-context=waylandvk
# Use 'auto' to intelligently select the best hardware decoder.
# On your system, this will default to 'qsv'. This is more robust.
hwdec=auto
osc=no
# for HDR
# dither-depth=10
# target-colorspace-hint=yes
# target-colorspace-hint-mode=source
# hdr-compute-peak=yes

# ==========================================================================
# Subtitles & Audio
# ==========================================================================
audio-device=auto
# Audio passthrough DTS (và Dolby)
audio-spdif=ac3,eac3,dts,dts-hd,truehd
# Only mpv can play audio, other apps can't
audio-exclusive=yes
audio-channels=auto
pulse-latency-hacks=yes

slang=vn,vie
alang=jpn,jp,eng,en,enUS,en-US,de,ger
sub-auto=fuzzy
embeddedfonts=yes
blend-subtitles=no

# Keep for compatibility with older subtitle formats
sub-ass-use-video-data=all
sub-ass-scale-with-window=no

# Personal preference, 1 is a good default
sub-border-size=1

# Auto-load external audio files with similar names
audio-file-auto=fuzzy

sub-font="UVN Sach Vo"
# sub-font-size=36
sub-bold=yes
sub-pos=120
# ==========================================================================
# OSD & Window
# ==========================================================================
osd-playing-msg='${media-title}'
autofit=85%x85%

# ==========================================================================
# Caching (More Reasonable Values)
# ==========================================================================
# These settings provide good buffering without excessive RAM usage.
cache=yes

[protocol.http]
profile=protocol-network

[protocol.https]
profile=protocol-network

[protocol-network]
hls-bitrate=max
# Use the general cache settings defined above.

# ========== CONDITIONAL PROFILES ==========
# 1. HDR Detection Profile: Triggered when content uses BT.2020 primaries and PQ gamma
[HDR-Detection]
profile-desc="HDR Video Tonemapping"
profile-cond=p["video-params/primaries"] == "bt.2020" and p["video-params/gamma"] == "pq"

# --- HDR-specific overrides ---
hdr-compute-peak=yes        # Dynamically calculates the scene's peak brightness
# saturation=-5             # (optional) adjust SDR saturation to your taste
profile-restore=copy        # Restores previous profile settings when condition ends
dither-depth=10
target-colorspace-hint=yes
target-colorspace-hint-mode=source
deband=no


# 2. SDR Profile: Triggered when HDR is NOT detected
[SDR-Content]
profile-desc="SDR Video Settings"
profile-cond=not (p["video-params/primaries"] == "bt.2020" and p["video-params/gamma"] == "pq")

# --- SDR-specific overrides ---
deband=yes                  # Ensure debanding is enabled for SDR content
# target-peak=100          # (optional) target-peak can be re-specified if needed
# icc-profile-auto=yes     # (optional) enable ICC color management for SDR
profile-restore=copy
