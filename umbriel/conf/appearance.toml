#:schema ../umbriel.schema.v5.json

[appearance]
  prefer_no_csd      = true
  border_width       = 2
  outer_border_width = 0
  corner_radius      = 10
  drag_opacity       = 0.75
  # Show desktop background instead backdrop color, depends on opaque of app
  opaque_fullscreen  = false

  [appearance.title_bar]
    mode = "off"

  # height               = 28
  # font                 = "sans 10"
  # button_position      = "right"
  # buttons              = ["minimize", "maximize", "close"]
  # button_corner_radius = -1
  # button_glyph         = "hover"
  # button_background    = true
  [appearance.tab_bar]
    style            = "titles"
    position         = "top"
    height           = 24
    font             = "Hack Nerd Font 12"
    padding          = 8
    tab_gap          = 2
    gap              = -1
    corner_radius    = -1
    title_format     = "{title}"
    title_align      = "center"
    visible          = true
    hide_when_single = false
    max_tabs         = 0
    overflow         = "scroll"

  [appearance.blur]
    enabled    = true
    optimized  = true
    passes     = 2
    radius     = 5
    noise      = 0.02
    brightness = 0.9
    contrast   = 0.9
    saturation = 1.1

  [appearance.shadow]
    enabled  = true
    softness = 10
    offset_x = 2
    offset_y = 2

[animation.windows_drag]
  physics              = false
  stiffness            = 36.0
  damping              = 6.5
  coupling             = 100.0
  pointer_response     = 2.0
  max_displacement_px  = 200.0
  settle_after_pause_s = 0.25
