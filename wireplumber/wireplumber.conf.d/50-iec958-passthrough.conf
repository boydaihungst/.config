monitor.alsa.rules = [
    {
        matches = [
            { node.name = "~alsa_output.*(hdmi|digital|iec958).*" }
        ]
        actions = {
            update-props = {
                # Enable passthrough for common formats
                # iec958.codecs = "[ PCM AC3 DTS ]"
                # Optional: prevent PipeWire from holding the device too long
                session.suspend-timeout-seconds = 0
                device.profile = "output:hdmi-surround71"
            }
        }
    }
]
