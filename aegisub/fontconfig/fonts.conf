<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  A self-contained fontconfig file for bwrap isolation.
  By NOT including any other conf.d files or system configs,
  this file becomes the *entire* configuration for the sandboxed app.
-->
<fontconfig>
  <!-- The ONLY font directory the sandbox will scan. -->
  <dir>/usr/share/fonts</dir>

  <!-- The ONLY cache directory the sandbox will use. -->
  <cachedir>/tmp/aegisub-fontcache</cachedir>

</fontconfig>
